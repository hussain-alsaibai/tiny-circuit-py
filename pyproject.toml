[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "tiny-circuit-py"
version = "0.1.0"
description = "Zero-dependency circuit breaker for Python. Thread-safe, sliding failure window, half-open testing."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Hussain Alsaibai", email = "hussain.alsaibai@gmail.com"}]
keywords = ["circuit-breaker", "resilience", "fault-tolerance"]
classifiers = ["Development Status :: 4 - Beta","License :: OSI Approved :: MIT License","Programming Language :: Python :: 3","Programming Language :: Python :: 3.8"]
requires-python = ">=3.8"
[tool.setuptools]
py-modules = ["circuit"]
